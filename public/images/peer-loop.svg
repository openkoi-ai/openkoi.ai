<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', monospace; }
    </style>
    <filter id="glow-orange">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#52525b"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="600" y="60" text-anchor="middle" fill="#e4e4e7" font-size="28" font-weight="700">The Think Pipeline</text>
  <text x="600" y="90" text-anchor="middle" fill="#71717a" font-size="14">Beyond simple loops: Cognitive deliberation before execution</text>

  <!-- Pipeline stages -->
  
  <!-- 01 SOVEREIGN -->
  <rect x="50" y="160" width="230" height="120" rx="12" fill="#141416" stroke="#71717a" stroke-width="2"/>
  <text x="165" y="195" text-anchor="middle" fill="#e4e4e7" font-size="12" font-weight="700" letter-spacing="0.1em">01 SOVEREIGN</text>
  <text x="165" y="235" text-anchor="middle" fill="#e4e4e7" font-size="20" font-weight="700">Directive</text>
  <text x="165" y="258" text-anchor="middle" fill="#71717a" font-size="11">Intention grounded in values</text>

  <!-- 02 PARLIAMENT -->
  <rect x="330" y="160" width="150" height="120" rx="12" fill="#141416" stroke="#22d3ee" stroke-width="2"/>
  <text x="405" y="195" text-anchor="middle" fill="#22d3ee" font-size="12" font-weight="700" letter-spacing="0.1em">02 JUDGE</text>
  <text x="405" y="235" text-anchor="middle" fill="#e4e4e7" font-size="20" font-weight="700">Verdict</text>
  <text x="405" y="258" text-anchor="middle" fill="#71717a" font-size="11">5 agencies vote</text>

  <!-- 03 WORKER / PEER -->
  <rect x="530" y="160" width="340" height="120" rx="12" fill="#141416" stroke="#ea580c" stroke-width="2"/>
  <text x="700" y="195" text-anchor="middle" fill="#ea580c" font-size="12" font-weight="700" letter-spacing="0.1em">03 WORKER</text>
  <text x="700" y="235" text-anchor="middle" fill="#e4e4e7" font-size="20" font-weight="700">PEER Loop</text>
  <text x="700" y="258" text-anchor="middle" fill="#71717a" font-size="11">Plan → Execute → Evaluate → Refine</text>

  <!-- 04 MANAGER -->
  <rect x="920" y="160" width="230" height="120" rx="12" fill="#141416" stroke="#a855f7" stroke-width="2"/>
  <text x="1035" y="195" text-anchor="middle" fill="#a855f7" font-size="12" font-weight="700" letter-spacing="0.1em">04 MANAGER</text>
  <text x="1035" y="235" text-anchor="middle" fill="#e4e4e7" font-size="20" font-weight="700">Learn</text>
  <text x="1035" y="258" text-anchor="middle" fill="#71717a" font-size="11">Extract patterns to World Model</text>

  <!-- Connection arrows -->
  <line x1="280" y1="220" x2="325" y2="220" stroke="#52525b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="220" x2="525" y2="220" stroke="#52525b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="870" y1="220" x2="915" y2="220" stroke="#52525b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PEER Cycle detail -->
  <path d="M 600 280 Q 600 360 700 360 Q 800 360 800 280" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <text x="700" y="380" text-anchor="middle" fill="#ea580c" font-size="11">Internal Iterations</text>

  <!-- Callouts -->
  <g transform="translate(150, 420)">
    <rect width="250" height="100" rx="8" fill="rgba(34,211,238,0.06)" stroke="#27272a" stroke-width="1"/>
    <text x="125" y="30" text-anchor="middle" fill="#22d3ee" font-size="12" font-weight="700">SOVEREIGN OVERSIGHT</text>
    <text x="25" y="55" fill="#71717a" font-size="11">• Intent alignment checks</text>
    <text x="25" y="75" fill="#71717a" font-size="11">• Constant soul-grounding</text>
    <text x="25" y="95" fill="#71717a" font-size="11">• Values > Speed</text>
  </g>

  <g transform="translate(470, 420)">
    <rect width="250" height="100" rx="8" fill="rgba(234,88,12,0.06)" stroke="#27272a" stroke-width="1"/>
    <text x="125" y="30" text-anchor="middle" fill="#ea580c" font-size="12" font-weight="700">PARLIAMENT VETO</text>
    <text x="25" y="55" fill="#71717a" font-size="11">• Guardian safety blocks</text>
    <text x="25" y="75" fill="#71717a" font-size="11">• Multi-perspective audit</text>
    <text x="25" y="95" fill="#71717a" font-size="11">• Inspectable reasoning</text>
  </g>

  <g transform="translate(790, 420)">
    <rect width="250" height="100" rx="8" fill="rgba(168,85,247,0.06)" stroke="#27272a" stroke-width="1"/>
    <text x="125" y="30" text-anchor="middle" fill="#a855f7" font-size="12" font-weight="700">CONTINUOUS LEARNING</text>
    <text x="25" y="55" fill="#71717a" font-size="11">• Error-driven learning</text>
    <text x="25" y="75" fill="#71717a" font-size="11">• Skill discovery</text>
    <text x="25" y="95" fill="#71717a" font-size="11">• Experience consolidation</text>
  </g>

  <!-- Bottom: branding -->
  <line x1="100" y1="560" x2="1100" y2="560" stroke="#27272a" stroke-width="1"/>
  <text x="600" y="600" text-anchor="middle" fill="#52525b" font-size="13">openkoi.ai | Rethink before Execute</text>
</svg>
