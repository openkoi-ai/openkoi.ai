<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="600" y="55" text-anchor="middle" fill="#e4e4e7" font-size="28" font-weight="700">Why Rust?</text>
  <text x="600" y="82" text-anchor="middle" fill="#71717a" font-size="14">Performance comparison: OpenKoi vs typical TypeScript/Python CLI agents</text>

  <!-- Table header -->
  <rect x="100" y="110" width="1000" height="44" rx="8" fill="#141416"/>
  <text x="260" y="138" text-anchor="middle" fill="#71717a" font-size="13" font-weight="700">METRIC</text>
  <text x="540" y="138" text-anchor="middle" fill="#ea580c" font-size="13" font-weight="700">OPENKOI (RUST)</text>
  <text x="780" y="138" text-anchor="middle" fill="#71717a" font-size="13" font-weight="700">TYPESCRIPT CLI</text>
  <text x="1000" y="138" text-anchor="middle" fill="#71717a" font-size="13" font-weight="700">PYTHON CLI</text>

  <!-- Row 1: Startup -->
  <line x1="100" y1="170" x2="1100" y2="170" stroke="#27272a" stroke-width="1"/>
  <text x="260" y="200" text-anchor="middle" fill="#e4e4e7" font-size="14">Startup time</text>
  <text x="540" y="200" text-anchor="middle" fill="#22c55e" font-size="16" font-weight="700">&lt;10ms</text>
  <text x="780" y="200" text-anchor="middle" fill="#ef4444" font-size="14">200-500ms</text>
  <text x="1000" y="200" text-anchor="middle" fill="#ef4444" font-size="14">300-800ms</text>
  <!-- Bar viz -->
  <rect x="460" y="212" width="16" height="8" rx="2" fill="#22c55e"/>
  <rect x="680" y="212" width="160" height="8" rx="2" fill="#ef4444" opacity="0.3"/>
  <rect x="900" y="212" width="200" height="8" rx="2" fill="#ef4444" opacity="0.3"/>

  <!-- Row 2: Memory -->
  <line x1="100" y1="240" x2="1100" y2="240" stroke="#27272a" stroke-width="1"/>
  <text x="260" y="270" text-anchor="middle" fill="#e4e4e7" font-size="14">Idle memory</text>
  <text x="540" y="270" text-anchor="middle" fill="#22c55e" font-size="16" font-weight="700">~5MB</text>
  <text x="780" y="270" text-anchor="middle" fill="#ef4444" font-size="14">50-100MB</text>
  <text x="1000" y="270" text-anchor="middle" fill="#ef4444" font-size="14">40-80MB</text>
  <!-- Bar viz -->
  <rect x="505" y="282" width="10" height="8" rx="2" fill="#22c55e"/>
  <rect x="680" y="282" width="150" height="8" rx="2" fill="#ef4444" opacity="0.3"/>
  <rect x="900" y="282" width="130" height="8" rx="2" fill="#ef4444" opacity="0.3"/>

  <!-- Row 3: Binary size -->
  <line x1="100" y1="310" x2="1100" y2="310" stroke="#27272a" stroke-width="1"/>
  <text x="260" y="340" text-anchor="middle" fill="#e4e4e7" font-size="14">Binary / package</text>
  <text x="540" y="340" text-anchor="middle" fill="#22c55e" font-size="16" font-weight="700">~20MB</text>
  <text x="780" y="340" text-anchor="middle" fill="#ef4444" font-size="14">100MB+ node_modules</text>
  <text x="1000" y="340" text-anchor="middle" fill="#ef4444" font-size="14">50MB+ venv</text>
  <!-- Bar viz -->
  <rect x="490" y="352" width="40" height="8" rx="2" fill="#22c55e"/>
  <rect x="680" y="352" width="200" height="8" rx="2" fill="#ef4444" opacity="0.3"/>
  <rect x="900" y="352" width="100" height="8" rx="2" fill="#ef4444" opacity="0.3"/>

  <!-- Row 4: Runtime deps -->
  <line x1="100" y1="380" x2="1100" y2="380" stroke="#27272a" stroke-width="1"/>
  <text x="260" y="410" text-anchor="middle" fill="#e4e4e7" font-size="14">Runtime deps</text>
  <text x="540" y="410" text-anchor="middle" fill="#22c55e" font-size="16" font-weight="700">0</text>
  <text x="780" y="410" text-anchor="middle" fill="#ef4444" font-size="14">Node.js 18+</text>
  <text x="1000" y="410" text-anchor="middle" fill="#ef4444" font-size="14">Python 3.10+</text>

  <!-- Row 5: Daemon -->
  <line x1="100" y1="440" x2="1100" y2="440" stroke="#27272a" stroke-width="1"/>
  <text x="260" y="470" text-anchor="middle" fill="#e4e4e7" font-size="14">Background daemon</text>
  <text x="540" y="470" text-anchor="middle" fill="#22c55e" font-size="16" font-weight="700">~5MB idle</text>
  <text x="780" y="470" text-anchor="middle" fill="#71717a" font-size="14">50-100MB idle</text>
  <text x="1000" y="470" text-anchor="middle" fill="#71717a" font-size="14">40-80MB idle</text>

  <!-- Row 6: Token cost -->
  <line x1="100" y1="500" x2="1100" y2="500" stroke="#27272a" stroke-width="1"/>
  <text x="260" y="530" text-anchor="middle" fill="#e4e4e7" font-size="14">3-iter task cost</text>
  <text x="540" y="530" text-anchor="middle" fill="#22c55e" font-size="16" font-weight="700">~$0.35</text>
  <text x="780" y="530" text-anchor="middle" fill="#71717a" font-size="14">~$1.50 (naive)</text>
  <text x="1000" y="530" text-anchor="middle" fill="#71717a" font-size="14">~$1.50 (naive)</text>

  <!-- Bottom line -->
  <line x1="100" y1="555" x2="1100" y2="555" stroke="#27272a" stroke-width="1"/>

  <!-- Branding -->
  <text x="600" y="600" text-anchor="middle" fill="#52525b" font-size="13">openkoi.ai</text>
</svg>
