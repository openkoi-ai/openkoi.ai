<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', monospace; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#52525b"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="600" y="55" text-anchor="middle" fill="#e4e4e7" font-size="28" font-weight="700">Pattern Mining: Your Workflows Become Skills</text>
  <text x="600" y="82" text-anchor="middle" fill="#71717a" font-size="14">OpenKoi observes your usage and proposes automated skills</text>

  <!-- Timeline -->
  <line x1="120" y1="180" x2="1080" y2="180" stroke="#27272a" stroke-width="2"/>

  <!-- Day markers -->
  <text x="160" y="170" text-anchor="middle" fill="#52525b" font-size="11">Day 1</text>
  <line x1="160" y1="175" x2="160" y2="185" stroke="#52525b" stroke-width="1"/>

  <text x="340" y="170" text-anchor="middle" fill="#52525b" font-size="11">Day 5</text>
  <line x1="340" y1="175" x2="340" y2="185" stroke="#52525b" stroke-width="1"/>

  <text x="520" y="170" text-anchor="middle" fill="#52525b" font-size="11">Day 10</text>
  <line x1="520" y1="175" x2="520" y2="185" stroke="#52525b" stroke-width="1"/>

  <text x="700" y="170" text-anchor="middle" fill="#ea580c" font-size="11" font-weight="700">Day 14</text>
  <line x1="700" y1="175" x2="700" y2="185" stroke="#ea580c" stroke-width="2"/>

  <text x="880" y="170" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="700">Day 15+</text>
  <line x1="880" y1="175" x2="880" y2="185" stroke="#22c55e" stroke-width="2"/>

  <!-- Event dots on timeline -->
  <circle cx="160" cy="180" r="4" fill="#ea580c" opacity="0.5"/>
  <circle cx="200" cy="180" r="4" fill="#ea580c" opacity="0.5"/>
  <circle cx="260" cy="180" r="4" fill="#ea580c" opacity="0.5"/>
  <circle cx="300" cy="180" r="4" fill="#ea580c" opacity="0.6"/>
  <circle cx="340" cy="180" r="4" fill="#ea580c" opacity="0.6"/>
  <circle cx="400" cy="180" r="4" fill="#ea580c" opacity="0.7"/>
  <circle cx="440" cy="180" r="4" fill="#ea580c" opacity="0.7"/>
  <circle cx="480" cy="180" r="4" fill="#ea580c" opacity="0.7"/>
  <circle cx="520" cy="180" r="4" fill="#ea580c" opacity="0.8"/>
  <circle cx="560" cy="180" r="4" fill="#ea580c" opacity="0.8"/>
  <circle cx="600" cy="180" r="4" fill="#ea580c" opacity="0.8"/>
  <circle cx="640" cy="180" r="4" fill="#ea580c" opacity="0.9"/>
  <circle cx="680" cy="180" r="4" fill="#ea580c" opacity="0.9"/>
  <circle cx="700" cy="180" r="6" fill="#ea580c"/>

  <!-- Phase 1: Manual usage -->
  <rect x="120" y="220" width="620" height="140" rx="10" fill="#141416" stroke="#27272a" stroke-width="1"/>
  <text x="140" y="250" fill="#ea580c" font-size="12" font-weight="700" letter-spacing="0.1em">PHASE 1: YOU USE IT MANUALLY</text>
  <text x="140" y="280" fill="#71717a" font-size="13">$ openkoi "summarize today's Slack messages"</text>
  <text x="140" y="302" fill="#71717a" font-size="13">$ openkoi "post summary to #team-updates in Notion"</text>
  <text x="140" y="332" fill="#52525b" font-size="12">Repeated daily for ~2 weeks. OpenKoi logs every task</text>
  <text x="140" y="350" fill="#52525b" font-size="12">to the usage_events table in SQLite.</text>

  <!-- Arrow down -->
  <line x1="700" y1="370" x2="700" y2="400" stroke="#52525b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Phase 2: Pattern detected -->
  <rect x="460" y="410" width="480" height="90" rx="10" fill="rgba(234,88,12,0.08)" stroke="#ea580c" stroke-width="1"/>
  <text x="480" y="440" fill="#ea580c" font-size="12" font-weight="700" letter-spacing="0.1em">PHASE 2: PATTERN DETECTED</text>
  <text x="480" y="465" fill="#e4e4e7" font-size="13">Pattern: "morning-slack-summary"</text>
  <text x="480" y="487" fill="#71717a" font-size="12">occurrences: 14 | confidence: 0.89 | schedule: weekdays 09:00</text>

  <!-- Arrow right -->
  <line x1="950" y1="455" x2="950" y2="530" stroke="#52525b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Phase 3: Proposed skill -->
  <rect x="780" y="540" width="300" height="60" rx="10" fill="rgba(234,179,8,0.08)" stroke="#eab308" stroke-width="1"/>
  <text x="800" y="565" fill="#eab308" font-size="12" font-weight="700" letter-spacing="0.1em">PHASE 3: SKILL PROPOSED</text>
  <text x="800" y="585" fill="#71717a" font-size="12">$ openkoi learn --approve</text>

  <!-- Arrow left -->
  <line x1="770" y1="570" x2="610" y2="570" stroke="#22c55e" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- Phase 4: Automated -->
  <rect x="120" y="540" width="480" height="60" rx="10" fill="rgba(34,197,94,0.08)" stroke="#22c55e" stroke-width="1"/>
  <text x="140" y="565" fill="#22c55e" font-size="12" font-weight="700" letter-spacing="0.1em">PHASE 4: RUNS AUTOMATICALLY</text>
  <text x="140" y="585" fill="#71717a" font-size="12">Daemon executes daily at 09:00 on weekdays. No human input needed.</text>

  <!-- Branding -->
  <text x="600" y="620" text-anchor="middle" fill="#52525b" font-size="13">openkoi.ai</text>
</svg>
