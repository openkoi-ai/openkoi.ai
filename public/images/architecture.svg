<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', monospace; }
    </style>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#52525b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" fill="#e4e4e7" font-size="24" font-weight="700">OpenKoi Cognitive Architecture (EFaaS)</text>
  <text x="600" y="68" text-anchor="middle" fill="#71717a" font-size="12">Sovereign-Parliament stack. Local world model. Graduated autonomy.</text>

  <!-- CLI / Nervous System -->
  <rect x="400" y="90" width="400" height="40" rx="6" fill="#141416" stroke="#ea580c" stroke-width="2"/>
  <text x="600" y="115" text-anchor="middle" fill="#ea580c" font-size="13" font-weight="700">CLI: The Nervous System (koi think, soul, reflect...)</text>

  <!-- SOVEREIGN / Identity -->
  <rect x="150" y="160" width="220" height="100" rx="8" fill="#141416" stroke="#71717a" stroke-width="2"/>
  <text x="260" y="185" text-anchor="middle" fill="#e4e4e7" font-size="14" font-weight="700">SOVEREIGN</text>
  <text x="260" y="205" text-anchor="middle" fill="#71717a" font-size="11">Identity Layer</text>
  <line x1="170" y1="215" x2="350" y2="215" stroke="#27272a" stroke-width="1"/>
  <text x="260" y="232" text-anchor="middle" fill="#ea580c" font-size="11" font-weight="500">Sovereign Directive</text>
  <text x="260" y="245" text-anchor="middle" fill="#71717a" font-size="10">Situational intent framing</text>

  <!-- PARLIAMENT / Judgment -->
  <rect x="420" y="160" width="550" height="100" rx="8" fill="#141416" stroke="#22d3ee" stroke-width="2"/>
  <text x="695" y="185" text-anchor="middle" fill="#22d3ee" font-size="14" font-weight="700">PARLIAMENT of MIND</text>
  
  <!-- Agencies -->
  <g transform="translate(440, 200)">
    <rect width="90" height="45" rx="4" fill="#1a1a1c" stroke="#27272a"/>
    <text x="45" y="25" text-anchor="middle" fill="#e4e4e7" font-size="10">Architect</text>
  </g>
  <g transform="translate(540, 200)">
    <rect width="100" height="45" rx="4" fill="#1a1a1c" stroke="#27272a"/>
    <text x="50" y="25" text-anchor="middle" fill="#e4e4e7" font-size="10">Investigator</text>
  </g>
  <g transform="translate(650, 200)">
    <rect width="90" height="45" rx="4" fill="#1a1a1c" stroke="#27272a"/>
    <text x="45" y="25" text-anchor="middle" fill="#e4e4e7" font-size="10">Critic</text>
  </g>
  <g transform="translate(750, 200)">
    <rect width="100" height="45" rx="4" fill="#1a1a1c" stroke="#27272a"/>
    <text x="50" y="25" text-anchor="middle" fill="#e4e4e7" font-size="10">Pragmatist</text>
  </g>
  <g transform="translate(860, 200)">
    <rect width="90" height="45" rx="4" fill="#1a1a1c" stroke="#ef4444" stroke-dasharray="2 2"/>
    <text x="45" y="25" text-anchor="middle" fill="#ef4444" font-size="10">Guardian</text>
  </g>

  <!-- Connection: CLI -> Deliberation -->
  <line x1="600" y1="130" x2="600" y2="155" stroke="#52525b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="370" y1="210" x2="415" y2="210" stroke="#52525b" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#a)"/>

  <!-- ORCHESTRATOR / Worker -->
  <rect x="350" y="290" width="500" height="60" rx="8" fill="#141416" stroke="#a855f7" stroke-width="2"/>
  <text x="600" y="320" text-anchor="middle" fill="#a855f7" font-size="14" font-weight="700">ORCHESTRATOR (PEER Loop)</text>
  <text x="600" y="340" text-anchor="middle" fill="#71717a" font-size="11">Plan → Execute → Evaluate → Refine</text>

  <!-- Connection: Parliament -> Orchestrator -->
  <line x1="695" y1="260" x2="600" y2="285" stroke="#52525b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- SUBSTRATE / World Model -->
  <rect x="150" y="380" width="900" height="100" rx="8" fill="#141416" stroke="#27272a" stroke-width="1"/>
  <text x="600" y="405" text-anchor="middle" fill="#22d3ee" font-size="14" font-weight="700">SUBSTRATE (World Model)</text>
  
  <!-- Atlases -->
  <g transform="translate(200, 420)">
    <rect width="240" height="40" rx="6" fill="#1a1a1c" stroke="#a855f7" stroke-width="1"/>
    <text x="120" y="25" text-anchor="middle" fill="#e4e4e7" font-size="11">Tool Atlas (reliability, failure modes)</text>
  </g>
  <g transform="translate(480, 420)">
    <rect width="240" height="40" rx="6" fill="#1a1a1c" stroke="#ea580c" stroke-width="1"/>
    <text x="120" y="25" text-anchor="middle" fill="#e4e4e7" font-size="11">Domain Atlas (patterns, skills, FTS5)</text>
  </g>
  <g transform="translate(760, 420)">
    <rect width="240" height="40" rx="6" fill="#1a1a1c" stroke="#22d3ee" stroke-width="1"/>
    <text x="120" y="25" text-anchor="middle" fill="#e4e4e7" font-size="11">Human Atlas (preferences, context)</text>
  </g>

  <!-- Connection: Substrate <-> Orchestrator -->
  <line x1="550" y1="375" x2="550" y2="355" stroke="#52525b" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="650" y1="355" x2="650" y2="375" stroke="#52525b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Graduated Trust & Autonomy -->
  <line x1="200" y1="510" x2="1000" y2="510" stroke="#27272a" stroke-width="1"/>
  <text x="600" y="535" text-anchor="middle" fill="#71717a" font-size="12" font-weight="700">AUTONOMY STACK</text>
  
  <g transform="translate(250, 550)">
    <text x="0" y="15" fill="#71717a" font-size="11">Shadow</text>
    <rect x="50" y="0" width="100" height="20" rx="4" fill="#1a1a1c" stroke="#27272a"/>
  </g>
  <g transform="translate(400, 550)">
    <text x="0" y="15" fill="#e4e4e7" font-size="11">Supervised</text>
    <rect x="80" y="0" width="100" height="20" rx="4" fill="#22d3ee" stroke="#22d3ee" fill-opacity="0.2"/>
  </g>
  <g transform="translate(560, 550)">
    <text x="0" y="15" fill="#71717a" font-size="11">Autonomous</text>
    <rect x="80" y="0" width="100" height="20" rx="4" fill="#1a1a1c" stroke="#27272a"/>
  </g>
  <g transform="translate(740, 550)">
    <text x="0" y="15" fill="#71717a" font-size="11">Trusted</text>
    <rect x="60" y="0" width="100" height="20" rx="4" fill="#1a1a1c" stroke="#27272a"/>
  </g>

  <!-- Branding -->
  <text x="600" y="605" text-anchor="middle" fill="#52525b" font-size="13">openkoi.ai</text>
</svg>
