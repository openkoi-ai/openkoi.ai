<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>

  <!-- Terminal Window -->
  <rect x="200" y="80" width="800" height="470" rx="12" fill="#141416" stroke="#27272a" stroke-width="1.5"/>
  
  <!-- Window Controls -->
  <circle cx="230" cy="110" r="6" fill="#ff5f56"/>
  <circle cx="255" cy="110" r="6" fill="#ffbd2e"/>
  <circle cx="280" cy="110" r="6" fill="#27c93f"/>
  
  <text x="500" y="115" text-anchor="middle" fill="#71717a" font-size="12" font-weight="500">zsh — openkoi --help</text>

  <!-- Terminal Content -->
  <g transform="translate(230, 160)">
    <text x="0" y="0" fill="#22c55e" font-size="14" font-weight="700">$ openkoi --help</text>
    
    <text x="0" y="35" fill="#e4e4e7" font-size="14">Usage: openkoi &lt;COMMAND&gt;</text>
    
    <text x="0" y="70" fill="#71717a" font-size="14">Cognitive Commands:</text>
    
    <!-- think -->
    <text x="20" y="100" fill="#ea580c" font-size="14" font-weight="700">think</text>
    <text x="120" y="100" fill="#e4e4e7" font-size="14">The EFaaS flagship — deliberate before acting</text>
    
    <!-- soul -->
    <text x="20" y="130" fill="#ea580c" font-size="14" font-weight="700">soul</text>
    <text x="120" y="130" fill="#e4e4e7" font-size="14">Inspect and evolve the Sovereign identity layer</text>
    
    <!-- mind -->
    <text x="20" y="160" fill="#ea580c" font-size="14" font-weight="700">mind</text>
    <text x="120" y="160" fill="#e4e4e7" font-size="14">Society of Mind: parliament, agencies, dissent</text>
    
    <!-- world -->
    <text x="20" y="190" fill="#ea580c" font-size="14" font-weight="700">world</text>
    <text x="120" y="190" fill="#e4e4e7" font-size="14">Query the world model (Tool/Domain/Human Atlases)</text>
    
    <!-- reflect -->
    <text x="20" y="220" fill="#ea580c" font-size="14" font-weight="700">reflect</text>
    <text x="120" y="220" fill="#e4e4e7" font-size="14">Trigger feedback loops (daily, weekly, growth)</text>
    
    <!-- trust -->
    <text x="20" y="250" fill="#ea580c" font-size="14" font-weight="700">trust</text>
    <text x="120" y="250" fill="#e4e4e7" font-size="14">Manage earned autonomy and delegation levels</text>
    
    <!-- cursor -->
    <text x="0" y="300" fill="#22c55e" font-size="14" font-weight="700">$ </text>
    <rect x="25" y="285" width="10" height="20" fill="#e4e4e7">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Caption -->
  <text x="600" y="590" text-anchor="middle" fill="#71717a" font-size="14" font-weight="500">Six new commands for the Cognitive Era.</text>
  <text x="600" y="612" text-anchor="middle" fill="#52525b" font-size="11">openkoi.ai | v2026.3.3</text>
</svg>
